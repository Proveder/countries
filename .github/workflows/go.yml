name: Go
run-name: ${{ github.actor }} is building 🔧
on: [push]
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      # setup-go/checkout were pinned at @v1 from the repo's Go 1.13 days;
      # those action versions run on a Node runtime GitHub's runners no
      # longer support. Aligned with the fleet's lint.yml (@v5/@v4). The old
      # `dep ensure` step is gone with them — this is a modules repo.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
